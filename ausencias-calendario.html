<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NB · Calendario de Ausencias</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #faf6f1 0%, #f0ebe4 50%, #e8e0d8 100%);
      color: #2d2319;
      min-height: 100vh;
      padding: 20px 16px 60px;
    }
    .topbar {
      max-width: 1100px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar a { color: #2e6b2e; text-decoration: none; font-size: 13px; font-weight: 600; }
    .topbar a:hover { text-decoration: underline; }

    .hero {
      background: linear-gradient(135deg, #1a3a1a 0%, #2e6b2e 50%, #3a7c3a 100%);
      color: white;
      padding: 24px;
      text-align: center;
      border-radius: 18px;
      max-width: 1100px;
      margin: 0 auto 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .hero h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .hero p { font-size: 13px; opacity: .85; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      max-width: 1100px;
      margin: 0 auto 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
    }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 14px;
    }
    .cal-nav {
      padding: 8px 16px; background: #f4ede4; border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 600; color: #2e6b2e;
    }
    .cal-nav:hover { background: #e8e0d8; }
    .cal-month { font-size: 18px; font-weight: 700; color: #1a3a1a; }
    .cal {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      background: #f0ebe4; padding: 2px; border-radius: 8px;
    }
    .cal-dow {
      padding: 8px 4px; background: #1a3a1a; color: white;
      font-size: 12px; font-weight: 700; text-align: center; text-transform: uppercase;
    }
    .cal-day {
      min-height: 110px; padding: 6px 7px; background: white;
      font-size: 12px; position: relative;
    }
    .cal-day.outside { background: #faf6f1; color: #c8b9a8; }
    .cal-day.today .cal-num { background: #2e6b2e; color: white; }
    .cal-num { display: inline-block; min-width: 22px; height: 22px; border-radius: 11px; text-align: center; line-height: 22px; font-weight: 600; font-size: 12px; }
    .cal-day.weekend .cal-num { color: #c62828; }
    .cal-evt {
      display: block; padding: 2px 5px; margin-top: 3px;
      font-size: 10px; border-radius: 3px; line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: default;
    }
    .cal-evt.permiso { background: #e3f2fd; color: #0d47a1; }
    .cal-evt.vacacion { background: #fff3e0; color: #bf360c; }
    .cal-evt.festivo { background: #f3e5f5; color: #4a148c; font-weight: 600; }
    .cal-evt.pendiente { opacity: .55; border: 1px dashed #999; }
    .cal-day.festivo-bg { background: #faf5fc; }
    .cal-legend { display: flex; gap: 18px; margin-top: 12px; font-size: 12px; color: #5e4e3d; flex-wrap: wrap; }
    .cal-legend .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
    .loading { text-align: center; padding: 60px 20px; color: #998777; font-size: 14px; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Volver al Centro de Finanzas</a>
  <div style="display:flex;gap:8px">
    <a href="permisos.html" style="padding:6px 12px;background:white;border-radius:8px;border:1px solid #d4cabe">Solicitar Permiso</a>
    <a href="vacaciones.html" style="padding:6px 12px;background:white;border-radius:8px;border:1px solid #d4cabe">Solicitar Vacaciones</a>
  </div>
</div>

<div class="hero">
  <h1>📅 Calendario de Ausencias</h1>
  <p>Permisos y vacaciones de todo el equipo · ayuda a planear sin traslapes</p>
</div>

<div class="card">
  <div class="cal-header">
    <button type="button" class="cal-nav" id="prevMonth">◀</button>
    <div class="cal-month" id="calMonth">—</div>
    <button type="button" class="cal-nav" id="nextMonth">▶</button>
  </div>
  <div id="calendar"><div class="loading">Cargando…</div></div>
  <div class="cal-legend">
    <span><span class="swatch" style="background:#fff3e0"></span>Vacación</span>
    <span><span class="swatch" style="background:#e3f2fd"></span>Permiso</span>
    <span><span class="swatch" style="background:#f3e5f5"></span>Día festivo (paid, no work)</span>
    <span><span class="swatch" style="background:white;border:1px dashed #999"></span>Pendiente de aprobar</span>
    <span style="color:#998777;font-size:11px;margin-left:auto">Pasa el cursor sobre un evento para ver detalles</span>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxQ7BzFITQnxyndvo2q7Xa1-Sc-yX5S8JGRc1mIbd4ye0rSpN2I2qx1zAjzRqbPXNeL/exec';

const $ = id => document.getElementById(id);
let calCursor = new Date();
calCursor.setDate(1);
let allEvents = [];

const isoDate = d => d.toISOString().slice(0, 10);

let allFestivos = [];

async function loadCalendar() {
  const from = isoDate(new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1));
  const to   = isoDate(new Date(calCursor.getFullYear(), calCursor.getMonth() + 2, 0));
  try {
    const [ausR, festR] = await Promise.all([
      fetch(API + `?action=get_ausencias_calendar&from=${from}&to=${to}`).then(r => r.json()),
      fetch(API + `?action=list_dias_festivos&from=${from}&to=${to}`).then(r => r.json())
    ]);
    if (ausR.ok) allEvents = ausR.ausencias;
    if (festR.ok) allFestivos = festR.festivos;
    renderCalendar();
  } catch (err) {
    $('calendar').innerHTML = '<div class="loading" style="color:#c62828">Error: ' + err.message + '</div>';
  }
}

function renderCalendar() {
  const y = calCursor.getFullYear();
  const m = calCursor.getMonth();
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  $('calMonth').textContent = `${monthNames[m]} ${y}`;

  const firstOfMonth = new Date(y, m, 1);
  const startWeekday = firstOfMonth.getDay();
  const start = new Date(y, m, 1 - ((startWeekday + 6) % 7));
  const today = new Date(); today.setHours(0,0,0,0);

  const byDate = {};
  allEvents.forEach(ev => {
    const ini = new Date(ev.fechaInicio + 'T00:00:00');
    const fin = new Date(ev.fechaFin + 'T00:00:00');
    const cur = new Date(ini);
    while (cur <= fin) {
      const k = isoDate(cur);
      if (!byDate[k]) byDate[k] = [];
      byDate[k].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });
  // Festivos as separate map keyed by date
  const festByDate = {};
  allFestivos.forEach(f => { festByDate[f.fecha] = f; });

  let html = '';
  const dows = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  dows.forEach(d => html += `<div class="cal-dow">${d}</div>`);

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const isoStr = isoDate(d);
    const dayNum = d.getDate();
    const inMonth = d.getMonth() === m;
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = d.getTime() === today.getTime();
    const evts = byDate[isoStr] || [];
    const fest = festByDate[isoStr];
    const festClass = fest ? ' festivo-bg' : '';
    let dayHtml = `<div class="cal-day${inMonth ? '' : ' outside'}${isWeekend ? ' weekend' : ''}${isToday ? ' today' : ''}${festClass}">`;
    dayHtml += `<span class="cal-num">${dayNum}</span>`;
    if (fest) {
      dayHtml += `<span class="cal-evt festivo" title="${fest.nombre} · ${fest.tipo}${fest.notas ? ' · ' + fest.notas : ''}">★ ${fest.nombre.substring(0, 16)}</span>`;
    }
    evts.slice(0, 5).forEach(ev => {
      const cls = ev.tipo === 'Vacacion' ? 'vacacion' : 'permiso';
      const pendCls = ev.respuesta === 'Pendiente' ? ' pendiente' : '';
      const firstName = ev.nombre.split(' ')[0];
      const detail = ev.tipo === 'Vacacion'
        ? `${ev.nombre} · Vacación ${ev.fechaInicio}—${ev.fechaFin} · ${ev.respuesta}`
        : `${ev.nombre} · Permiso ${ev.horarioAusente || ''} · ${ev.asunto} · ${ev.respuesta}`;
      dayHtml += `<span class="cal-evt ${cls}${pendCls}" title="${detail}">${firstName}</span>`;
    });
    if (evts.length > 5) dayHtml += `<span class="cal-evt" style="color:#998777">+${evts.length-5} más</span>`;
    dayHtml += '</div>';
    html += dayHtml;
  }
  $('calendar').innerHTML = `<div class="cal">${html}</div>`;
}

$('prevMonth').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth() - 1); loadCalendar(); });
$('nextMonth').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth() + 1); loadCalendar(); });

loadCalendar();
</script>

</body>
</html>
